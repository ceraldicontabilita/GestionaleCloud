# Render Blueprint: contratto versionato del servizio di produzione.
#
# Stato verificato via Render API il 06/08/2026:
# - un solo web service Python serve FastAPI e frontend/dist dallo stesso host;
# - il frontend deve essere compilato durante ogni deploy;
# - le variabili reali restano esclusivamente nella dashboard Render.
#
# Il file non modifica automaticamente un servizio gia esistente se questo non
# e collegato a un Blueprint. Rimane comunque la fonte versionata da usare per
# controllare e ricostruire la configurazione senza dipendere dalla dashboard.

services:
  - type: web
    name: GestionaleCloud
    runtime: python
    plan: starter
    branch: main
    autoDeploy: true
    # App portate pari pari, ognuna con la propria build servita dal proprio
    # backend montato come sub-app (vedi app/<app>/embed.py):
    # - frontend_lotti = Lotti (HACCP), build CRA, montata a /lotti;
    # - frontend_menu  = Menu digitale, build CRA (PUBLIC_URL=/menu), a /menu;
    # - frontend_hr    = AppDipendenti, build Vite (base /hr/), a /hr.
    # ATTENZIONE: la dashboard Render NON recepisce da sola questo file (vedi
    # DATA_BACKEND, 03/09/2026): il Build Command va incollato una volta in
    # Settings del servizio. scripts/build_frontends.sh compila tutte le
    # cartelle frontend_*/ presenti, quindi il comando non cambia piu'.
    buildCommand: >-
      pip install -r backend/requirements.txt &&
      bash scripts/build_frontends.sh
    # Il piano Starter dispone di 512 MiB: due interpreti Python completi
    # duplicano il registro Sheets in memoria e superano il limite. FastAPI e
    # APScheduler vivono quindi nello stesso processo; PROCESS_ROLE=combined
    # mantiene attive le automazioni senza una seconda copia del database.
    startCommand: python -m uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      # rapidocr-onnxruntime 1.4.4 supporta Python < 3.13. Il pin evita che
      # l'aggiornamento automatico del runtime Render interrompa i deploy.
      - key: PYTHON_VERSION
        value: "3.12.10"
      - key: PYTHONUTF8
        value: "1"
      - key: FAIL_FAST_SECRETS
        value: "true"
      # Archivio unico: Supabase (decisione del titolare 03/09/2026, fusione
      # delle app). Le tre SUPABASE_* restano nella dashboard Render.
      - key: DATA_BACKEND
        value: "supabase"
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: SUPABASE_RUNTIME_SECRET
        sync: false
      # --- App Lotti (HACCP) portata pari pari (app/lotti, montata a /lotti):
      # progetto Supabase `Lotti-HACCP` (tabella lotti_documents + RPC lotti_*)
      # e segreto JWT proprio (fallback AUTH_SECRET). Senza LOTTI_SUPABASE_URL
      # l'archivio di Lotti resta in memoria (non persistente).
      - key: LOTTI_SUPABASE_URL
        sync: false
      - key: LOTTI_SUPABASE_ANON_KEY
        sync: false
      - key: LOTTI_DB_SECRET
        sync: false
      - key: LOTTI_AUTH_SECRET
        sync: false
      # --- App Menu portata pari pari (app/menu, montata a /menu): tabelle
      # menu_* nel progetto Supabase `Lotti-HACCP` (client PostgREST), segreto
      # JWT del login admin e credenziali dell'unico utente amministratore.
      - key: MENU_SUPABASE_URL
        sync: false
      - key: MENU_SUPABASE_KEY
        sync: false
      - key: MENU_JWT_SECRET
        sync: false
      - key: MENU_ADMIN_USERNAME
        sync: false
      - key: MENU_ADMIN_PASSWORD
        sync: false
      # --- AppDipendenti portata pari pari (app/hr, montata a /hr): DSN
      # Postgres/Supabase (asyncpg) delle tabelle app_* dell'app originale,
      # segreto JWT del suo login e PIN dell'amministratore HR.
      - key: HR_SUPABASE_DB_URL
        sync: false
      - key: HR_JWT_SECRET
        sync: false
      - key: HR_PIN_CODE
        sync: false
      # DSN Postgres della vecchia AppDipendenti: resta come fallback di
      # HR_SUPABASE_DB_URL (stesso database).
      - key: APPDIPENDENTI_DB_URL
        sync: false
      - key: SHEETS_REGISTRY_NAME
        value: "GestionaleCloud"
      - key: PROCESS_ROLE
        value: "combined"
      - key: ENABLE_SCHEDULER
        value: "true"
      - key: DRIVE_FATTURE_BATCH_SIZE
        value: "1"
      - key: DRIVE_ESTRATTI_BATCH_SIZE
        value: "1"
      - key: GOOGLE_SHEETS_LEDGER_ID
        sync: false
      - key: GOOGLE_DRIVE_SERVICE_ACCOUNT_JSON
        sync: false
      - key: CREDENTIALS_ENCRYPTION_KEY
        sync: false
      # Chiave server-to-server usata esclusivamente dalla proiezione read-only
      # delle fatture verso Lotti. Il valore resta nella dashboard Render.
      - key: LOTTI_INTEGRATION_KEY
        sync: false
      - key: SUMUP_API_KEY
        sync: false
      - key: SUMUP_MERCHANT_CODE
        sync: false
      # Credenziali, archivio e integrazioni sono configurati nella dashboard.
      # Non aggiungere valori sensibili al repository.
