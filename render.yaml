# Render Blueprint: contratto versionato del servizio di produzione.
#
# Stato verificato via Render API il 06/08/2026:
# - un solo web service Python serve FastAPI e frontend/dist dallo stesso host;
# - il frontend deve essere compilato durante ogni deploy;
# - le variabili reali restano esclusivamente nella dashboard Render.
#
# Il file non modifica automaticamente un servizio gia esistente se questo non
# e collegato a un Blueprint. Rimane comunque la fonte versionata da usare per
# controllare e ricostruire la configurazione senza dipendere dalla dashboard.

services:
  - type: web
    name: GestionaleCloud
    runtime: python
    plan: starter
    branch: main
    autoDeploy: true
    # App portate pari pari, ognuna con la propria build servita dal proprio
    # backend montato come sub-app (vedi app/<app>/embed.py):
    # - frontend_lotti = Lotti (HACCP), build CRA, montata a /lotti;
    # - frontend_menu  = Menu digitale, build CRA (PUBLIC_URL=/menu), a /menu;
    # - frontend_hr    = AppDipendenti, build Vite (base /hr/), a /hr.
    # ATTENZIONE: la dashboard Render NON recepisce da sola questo file (vedi
    # DATA_BACKEND, 03/09/2026): il Build Command va incollato una volta in
    # Settings del servizio. scripts/build_frontends.sh compila tutte le
    # cartelle frontend_*/ presenti, quindi il comando non cambia piu'.
    # Identico al Build Command impostato in dashboard (che NON recepisce
    # render.yaml): `npm --prefix frontend run build` compila il gestionale e
    # poi, tramite scripts/build_frontends.sh --apps, tutte le cartelle
    # frontend_*/ delle app portate pari pari. Nessuna modifica in dashboard.
    buildCommand: >-
      pip install -r backend/requirements.txt &&
      npm --prefix frontend install --include=dev --legacy-peer-deps &&
      npm --prefix frontend run build
    # Due interpreti Python completi duplicano la cache dell'archivio in
    # memoria e superano il limite di RAM del piano. FastAPI e
    # APScheduler vivono quindi nello stesso processo; PROCESS_ROLE=combined
    # mantiene attive le automazioni senza una seconda copia del database.
    startCommand: python -m uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      # rapidocr-onnxruntime 1.4.4 supporta Python < 3.13. Il pin evita che
      # l'aggiornamento automatico del runtime Render interrompa i deploy.
      - key: PYTHON_VERSION
        value: "3.12.10"
      - key: PYTHONUTF8
        value: "1"
      - key: FAIL_FAST_SECRETS
        value: "true"
      # Archivio unico: Supabase (decisione del titolare 03/09/2026, fusione
      # delle app). Le tre SUPABASE_* restano nella dashboard Render.
      - key: DATA_BACKEND
        value: "supabase"
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: SUPABASE_RUNTIME_SECRET
        sync: false
      # --- App Lotti (HACCP) portata pari pari (app/lotti, montata a /lotti):
      # progetto Supabase `Lotti-HACCP` (tabella lotti_documents + RPC lotti_*)
      # e segreto JWT proprio (fallback AUTH_SECRET). Senza LOTTI_SUPABASE_URL
      # l'archivio di Lotti resta in memoria (non persistente).
      - key: LOTTI_SUPABASE_URL
        sync: false
      - key: LOTTI_SUPABASE_ANON_KEY
        sync: false
      - key: LOTTI_DB_SECRET
        sync: false
      - key: LOTTI_AUTH_SECRET
        sync: false
      # --- App Menu portata pari pari (app/menu, montata a /menu): tabelle
      # menu_* nel progetto Supabase `Lotti-HACCP` (client PostgREST), segreto
      # JWT del login admin e credenziali dell'unico utente amministratore.
      - key: MENU_SUPABASE_URL
        sync: false
      - key: MENU_SUPABASE_KEY
        sync: false
      - key: MENU_JWT_SECRET
        sync: false
      - key: MENU_ADMIN_USERNAME
        sync: false
      - key: MENU_ADMIN_PASSWORD
        sync: false
      # --- AppDipendenti portata pari pari (app/hr, montata a /hr): DSN
      # Postgres/Supabase (asyncpg) delle tabelle app_* dell'app originale,
      # segreto JWT del suo login. Il PIN admin usa PIN_HASH_ADMIN dell'ERP.
      - key: HR_SUPABASE_DB_URL
        sync: false
      - key: HR_JWT_SECRET
        sync: false
      # DSN Postgres della vecchia AppDipendenti: resta come fallback di
      # HR_SUPABASE_DB_URL (stesso database).
      - key: APPDIPENDENTI_DB_URL
        sync: false
      # --- Protocollo-indice vivo dei documenti su Drive (14/09/2026):
      # radice GESTIONALE da percorrere e cartella di quarantena dei duplicati
      # certi. Il giro periodico riconcilia Drive con gestionale.protocollo_drive.
      - key: GOOGLE_DRIVE_GESTIONALE_ROOT_FOLDER_ID
        sync: false
      - key: GOOGLE_DRIVE_QUARANTENA_FOLDER_ID
        sync: false
      # --- Fascicolo dipendente su Drive (14/09/2026): UNA radice per persona
      # (05_PERSONALE_E_CEDOLINI/DIPENDENTI). Cedolini in <COGNOME NOME>/DA
      # ELABORARE, bonifici in <COGNOME NOME>/BONIFICI/DA ELABORARE: le due
      # variabili puntano alla STESSA cartella, i canali si distinguono per
      # posizione (vedi app/services/drive_documenti_ingest.py, canale bonifico).
      # --- Cartella unica «DATI SOCIETA CERALDI» (25/09/2026): DA ELABORARE /
      # ELABORATE / ERRORI. Ogni documento passa dallo smistatore di Documenti >
      # Import e «vedi documento» legge solo da ELABORATE
      # (app/services/drive_cartella_unica.py). Id cartella, non un segreto;
      # vuota = giro spento. Proprietario: titolare.
      - key: GOOGLE_DRIVE_DATI_FOLDER_ID
        sync: false
      - key: DRIVE_CARTELLA_UNICA_BATCH
        value: "25"
      # Simulazione della migrazione (sola lettura): radice Drive da percorrere,
      # vuota = spenta. Cambiare EDIZIONE rilegge tutto dopo una correzione.
      - key: DRIVE_SIMULAZIONE_RADICE
        sync: false
      - key: DRIVE_SIMULAZIONE_EDIZIONE
        value: "1"
      - key: DRIVE_SIMULAZIONE_BATCH
        value: "40"
      - key: GOOGLE_DRIVE_CEDOLINI_FOLDER_ID
        sync: false
      - key: GOOGLE_DRIVE_BONIFICI_FOLDER_ID
        sync: false
      # radici bonifici separate da virgola: fascicoli DIPENDENTI + 03/BONIFICI
      - key: GOOGLE_DRIVE_BONIFICI_FOLDER_IDS
        sync: false
      - key: PROCESS_ROLE
        value: "combined"
      - key: ENABLE_SCHEDULER
        value: "true"
      - key: DRIVE_FATTURE_BATCH_SIZE
        value: "25"
      - key: DRIVE_ESTRATTI_BATCH_SIZE
        value: "1"
      - key: GOOGLE_DRIVE_SERVICE_ACCOUNT_JSON
        sync: false
      - key: CREDENTIALS_ENCRYPTION_KEY
        sync: false
      # PIN amministratore unico ERP/HR/Menu/Lotti (SHA-256 hex). Solo dashboard.
      - key: PIN_HASH_ADMIN
        sync: false
      - key: SECRET_KEY
        sync: false
      # Chiave server-to-server usata esclusivamente dalla proiezione read-only
      # delle fatture verso Lotti. Il valore resta nella dashboard Render.
      - key: LOTTI_INTEGRATION_KEY
        sync: false
      - key: SUMUP_API_KEY
        sync: false
      - key: SUMUP_MERCHANT_CODE
        sync: false
      # --- Banco BPM via Enable Banking (PSD2, sola lettura), modalita' ombra.
      # Proprietario: titolare (Vincenzo Ceraldi). Spenta per default: senza
      # ENABLE_BANKING_ENABLED=true le rotte /api/banca/enable-banking/*
      # rispondono 503. ID e chiave sono gli stessi del servizio di prova
      # (pannello Enable Banking); la chiave privata si ruota rigenerandola li'.
      # La sessione della banca si salva cifrata con CREDENTIALS_ENCRYPTION_KEY.
      # Si accende dalla dashboard Render (valore «true»); assente = spenta.
      - key: ENABLE_BANKING_ENABLED
        sync: false
      - key: ENABLE_BANKING_APPLICATION_ID
        sync: false
      - key: ENABLE_BANKING_PRIVATE_KEY_PEM
        sync: false
      # Deve coincidere con il redirect URL registrato nel pannello Enable Banking.
      - key: ENABLE_BANKING_REDIRECT_URL
        value: "https://gestionalecloud.onrender.com/api/banca/enable-banking/callback"
      # Credenziali, archivio e integrazioni sono configurati nella dashboard.
      # Non aggiungere valori sensibili al repository.
