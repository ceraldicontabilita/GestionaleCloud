<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#7a2e1d">
<title>Colazioni B&B · Bar Ceraldi</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
:root{--bg:#fbf6ee;--card:#fff;--ink:#2b1d16;--mute:#7b6a60;--brand:#7a2e1d;--brand2:#c8873a;--ok:#2f7d4f;--warn:#b7791f;--bad:#b3261e;--line:#eadfce;--r:16px}
@media(prefers-color-scheme:dark){:root{--bg:#1c1410;--card:#2a1e18;--ink:#f4e9dd;--mute:#b5a294;--line:#3d2c23;--brand:#e0a06a;--brand2:#c8873a}}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--ink);line-height:1.45}
header{background:linear-gradient(135deg,#7a2e1d,#a4492b);color:#fff;padding:14px 16px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:5}
header h1{font-size:18px;margin:0;flex:1}
header button{background:rgba(255,255,255,.18);color:#fff;border:0;border-radius:10px;padding:6px 10px;font-size:13px}
main{max-width:760px;margin:0 auto;padding:16px 16px 90px}
h2{font-size:20px;margin:18px 0 8px}h3{font-size:16px;margin:0 0 6px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin:10px 0}
.grid{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
.big{display:block;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px;margin:10px 0;font-size:16px;color:var(--ink);cursor:pointer}
.big b{display:block;font-size:18px}.big span{color:var(--mute);font-size:14px}
.btn{background:var(--brand);color:#fff;border:0;border-radius:12px;padding:12px 16px;font-size:16px;font-weight:600;cursor:pointer}
.btn.sec{background:transparent;color:var(--brand);border:1.5px solid var(--brand)}
.btn.sm{padding:6px 10px;font-size:13px;border-radius:9px}
.btn:disabled{opacity:.4}
input,select{width:100%;padding:11px;border:1px solid var(--line);border-radius:10px;font-size:16px;background:var(--card);color:var(--ink);margin:4px 0 10px}
label{font-size:13px;color:var(--mute);font-weight:600}
.row{display:flex;gap:10px;align-items:center;justify-content:space-between}
.pill{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:700}
.p-ok{background:#dff3e6;color:var(--ok)}.p-warn{background:#fbecd0;color:var(--warn)}.p-bad{background:#f8dcda;color:var(--bad)}
.price{font-size:26px;font-weight:800;color:var(--brand)}
.kpi{font-size:30px;font-weight:800}.mute{color:var(--mute);font-size:14px}
.tabs{display:flex;gap:6px;overflow-x:auto;margin:6px 0 10px}
.tabs button{flex:none;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:8px 14px;border-radius:99px;font-size:14px}
.tabs button.on{background:var(--brand);color:#fff;border-color:var(--brand)}
table{width:100%;border-collapse:collapse;font-size:14px}td,th{padding:8px 4px;border-bottom:1px solid var(--line);text-align:left}
.qr{display:flex;justify-content:center;padding:14px;background:#fff;border-radius:14px}
.alert{border-left:5px solid var(--warn);background:var(--card);border-radius:10px;padding:10px 12px;margin:8px 0}
.alert.bad{border-color:var(--bad)}.alert.ok{border-color:var(--ok)}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:#222;color:#fff;padding:10px 16px;border-radius:12px;z-index:9;font-size:14px}
.demo{font-size:12px;background:#fff3cd;color:#664d03;padding:6px 10px;text-align:center}

main.wide{max-width:1100px}
.tabs button.on{font-weight:700}
.kpis{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));margin:10px 0}
.kpis .card{margin:0}.kpis .k{font-size:26px;font-weight:800;line-height:1.1}
.bars{display:flex;align-items:flex-end;gap:8px;height:110px;margin-top:8px}
.bars div{flex:1;text-align:center;font-size:11px;color:var(--mute)}
.bars i{display:block;background:var(--brand2);border-radius:6px 6px 0 0;min-height:3px;margin-bottom:4px}
.bars b{display:block;color:var(--ink);font-size:13px}
.scroll{overflow-x:auto}
.filters{display:grid;gap:8px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.filters input,.filters select{margin:0}
textarea{width:100%;padding:11px;border:1px solid var(--line);border-radius:10px;font-size:15px;background:var(--card);color:var(--ink);margin:4px 0 10px;font-family:inherit}
.btn.bad{background:var(--bad)}
a{color:var(--brand);font-weight:600}a:visited{color:var(--brand)}
.crumb{font-size:14px;margin:4px 0 8px}.crumb a{color:var(--brand)}
.hint{background:var(--card);border:1px dashed var(--line);border-radius:12px;padding:10px 12px;font-size:14px;color:var(--mute);margin:8px 0}
#printarea{display:none}
@media print{
 body>*:not(#printarea){display:none!important}
 #printarea{display:grid!important;grid-template-columns:1fr 1fr;gap:10mm;background:#fff;color:#000}
 .pcard{border:2px dashed #999;border-radius:8px;padding:8mm;text-align:center;break-inside:avoid;font-family:system-ui,sans-serif}
 .pcard h3{margin:0 0 2mm;font-size:16pt}.pcard .qr{border:0;padding:4mm}.pcard small{color:#444}
}

.stepper{display:flex;align-items:center;gap:6px}
.stepper button{width:30px;height:30px;border-radius:50%;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:18px;line-height:1;cursor:pointer}
.sticky-bar{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);padding:10px 16px;display:flex;gap:10px;align-items:center;justify-content:space-between;z-index:6;box-shadow:0 -4px 14px rgba(0,0,0,.08)}
.hero{border-radius:16px;color:#fff;padding:34px 20px;text-align:center;background:linear-gradient(135deg,#7a2e1d,#c8873a);background-size:cover;background-position:center;margin-bottom:12px;text-shadow:0 1px 6px rgba(0,0,0,.45)}
.hero h1{margin:0;font-size:26px}.hero p{margin:8px 0 0;font-size:15px}
.prod{display:flex;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);cursor:pointer;align-items:center}
.pimg{width:64px;height:64px;border-radius:12px;object-fit:cover;background:var(--line);flex:none}
.pimg.ph,.bigph{display:flex;align-items:center;justify-content:center;font-size:26px;color:var(--brand2)}
.bigph{height:140px;background:var(--line);border-radius:20px 20px 0 0;font-size:48px}
.pinfo{flex:1;min-width:0}.pinfo .mute{font-size:13px}
.pside{text-align:right;white-space:nowrap}.pside .stepper{justify-content:flex-end;margin-top:4px}
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--card);color:var(--ink);width:100%;max-width:560px;max-height:90vh;overflow:auto;border-radius:20px 20px 0 0;padding-bottom:16px}
.sheet img.big{width:100%;height:220px;object-fit:cover;border-radius:20px 20px 0 0;display:block}
.sheet .in{padding:14px 16px}
</style>
</head>
<body>
<div class="demo">VERSIONE DI PROVA</div>
<header><h1 id="ttl">☕ Colazioni B&B</h1><button id="back" hidden onclick="go('#/')">← Home</button></header>
<main id="app"></main>

<script>
/* ============ CONFIG ============ */
const SB_URL="https://lohczjdiawjryuopncwc.supabase.co";
const SB_KEY="sb_publishable_bJy0E8c6MwYl0GA7W5Clvg_JIe3Zvcn"; // chiave pubblica: i dati sono protetti dai PIN nelle funzioni bb_*
const eur=n=>Number(n).toLocaleString("it-IT",{style:"currency",currency:"EUR"});
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const dmy=d=>{const[a,b,c]=String(d).slice(0,10).split("-");return `${c}/${b}/${a}`};
const addDays=(d,n)=>{const x=new Date(d+"T12:00:00");x.setDate(x.getDate()+n);return x.toISOString().slice(0,10)};
const $=s=>document.querySelector(s),app=$("#app");
function toast(m){const t=document.createElement("div");t.className="toast";t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),2800)}

/* ============ API (Supabase RPC) ============ */
async function rpc(fn,args={}){
 const r=await fetch(`${SB_URL}/rest/v1/rpc/${fn}`,{method:"POST",headers:{apikey:SB_KEY,Authorization:"Bearer "+SB_KEY,"Content-Type":"application/json"},body:JSON.stringify(args)});
 const j=await r.json().catch(()=>null);
 if(!r.ok)throw new Error((j&&j.message)||"Errore di rete");
 return j}
async function run(fn,args,okMsg){try{const r=await rpc(fn,args);if(okMsg)toast(okMsg);return r??true}catch(e){
 if(/Sessione scaduta/i.test(e.message)&&sess){const r=sess.r,c=sess.c;setSess(null);toast("Sessione scaduta: rientra");go(r==="alb"&&c?"#/hotel/"+c:"#/titolare");return undefined}
 toast(e.message);return undefined}}

/* ============ DATI ESTERNI: navi (Guardia Costiera) e scioperi (MIT), via Supabase ============ */
let EXT=null;
async function loadExt(){if(!EXT)EXT=await rpc("bb_esterni_pubblico").catch(()=>({}));return EXT}
const romeDay=iso=>new Date(iso).toLocaleDateString("sv-SE",{timeZone:"Europe/Rome"});
const romeTime=iso=>new Date(iso).toLocaleTimeString("it-IT",{hour:"2-digit",minute:"2-digit",timeZone:"Europe/Rome"});
function naviOggi(E){
 const N=E&&E.navi;if(!N||!N.arrivi)return null;const oggi=E.oggi,ok=n=>n.stato!=="CANCELED"&&romeDay(n.ora)===oggi;
 const arr=N.arrivi.filter(ok);return {cr:arr.filter(n=>n.tipo==="crociera"),alt:arr.filter(n=>n.tipo!=="crociera"),part:(N.partenze||[]).filter(n=>ok(n)&&n.tipo==="crociera")}}
function naviHtml(E){
 const o=naviOggi(E);if(!o)return `<p class="mute">Dati sulle navi non disponibili al momento.</p>`;
 const r=n=>`<div class="row"><span>${esc(n.nome)}</span><span class="mute">${romeTime(n.ora)}${n.banchina?" · "+esc(n.banchina):""}</span></div>`;
 return (o.cr.length?`<b>Crociere in arrivo (${o.cr.length})</b>${o.cr.map(r).join("")}`:`<p class="mute">Nessuna nave da crociera in arrivo oggi.</p>`)+
  (o.part.length?`<b style="display:block;margin-top:8px">Crociere in partenza</b>${o.part.map(r).join("")}`:"")+
  `<p class="mute">${o.alt.length} arrivi di traghetti/aliscafi oggi. Orari previsti, fuso italiano · fonte Guardia Costiera.</p>`}
function scioperiList(E,giorni=14){
 const S=E&&E.scioperi&&E.scioperi.elenco;if(!S)return null;const oggi=E.oggi,fine=addDays(oggi,giorni);
 return S.filter(x=>x.fine>=oggi&&x.inizio<=fine).slice(0,10)}
function scioperiHtml(E){
 const l=scioperiList(E);if(!l)return `<p class="mute">Dati sugli scioperi non disponibili al momento.</p>`;
 return (l.length?l.map(x=>`<div class="alert ${x.inizio<=E.oggi?"bad":""}"><b>${esc(x.settore)} · ${x.inizio<=E.oggi?"OGGI":dmy(x.inizio)}${x.fine!==x.inizio?" → "+dmy(x.fine):""}</b><br>${esc(x.modalita)} · ${esc(x.categoria)}${x.rilevanza==="Nazionale"?" (nazionale)":""}</div>`).join(""):`<p class="mute">Nessuno sciopero dei trasporti previsto nei prossimi 14 giorni.</p>`)+`<p class="mute">Fonte: Ministero delle Infrastrutture e dei Trasporti.</p>`}

/* ============ SESSIONE, ROUTER, UTILITÀ ============ */
let sess=JSON.parse(sessionStorage.getItem("sess")||"null");
const setSess=x=>{sess=x;sessionStorage.setItem("sess",JSON.stringify(x))};
const go=h=>{if(location.hash===h)render();else location.hash=h};
const esci=()=>{const c=sess&&sess.c,r=sess&&sess.r,p=sess&&sess.p;if(r==="alb"&&p)rpc("bb_alb_logout",{p}).catch(()=>{});setSess(null);go(c?"#/hotel/"+c:r==="tit"?"#/titolare":"#/")};
const loading=()=>{app.innerHTML=`<p class="mute" style="text-align:center;margin-top:40px">Caricamento…</p>`};
addEventListener("hashchange",render);
async function render(){
 const h=location.hash||"#/";const p=h.split("/");
 $("#back").hidden=h==="#/"||h==="#"||["ospite","hotel","invito","recupero"].includes(p[1])||(!!sess&&sess.r==="alb"&&p[1]==="albergatore");
 app.classList.toggle("wide",p[1]==="titolare"&&!!sess);
 if(p[1]==="ospite")return ospite(p[2]);
 if(p[1]==="hotel")return hotelLogin(p[2]);
 if(p[1]==="invito")return invito(p[2]);
 if(p[1]==="recupero")return recupero(p[2]);
 if(p[1]==="albergatore")return sess&&sess.r==="alb"?alb(p[2]||"home"):(($("#ttl").textContent="☕ Colazioni B&B"),void(app.innerHTML=`<div class="card">Per entrare usa il <b>link personale</b> che ti ha inviato il bar.</div>`));
 if(p[1]==="titolare")return sess&&sess.r==="tit"?tit(p[2]||"cruscotto",p[3]):loginTit();
 home()}
function qr(el,text,size=200){el.innerHTML="";if(window.QRCode)new QRCode(el,{text,width:size,height:size,correctLevel:QRCode.CorrectLevel.M});else el.textContent=text}
const base=()=>location.href.split("#")[0];
const linkOspite=id=>base()+"#/ospite/"+id;
const tabsHtml=(tabs,sec,pre)=>`<div class="tabs">${tabs.map(t=>`<button class="${t[0]===sec?"on":""}" onclick="go('#/${pre}/${t[0]}')">${t[1]}</button>`).join("")}<button onclick="esci()">Esci</button></div>`;
const camNome=v=>{const c=(v.camera||"").trim();if(!c)return v.ospite||"";return /^(camera|suite|stanza|appartamento|junior|room|studio|mansarda)\b/i.test(c)?c:"Camera "+c};
const ospTxt=n=>`${n} ospit${n>1?"i":"e"}`;
const descV=(v,prezzo=true)=>{const eu=prezzo&&v.fascia!=null?" · colazione da €"+String(v.fascia).replace(".",","):"";return v.camera?camNome(v)+" · "+ospTxt(v.ospiti||1)+eu:camNome(v)+eu};
const fine=v=>v.data_fine||v.data;
const dRange=v=>fine(v)!==v.data?dmy(v.data)+" → "+dmy(fine(v)):dmy(v.data);
const nGiorni=(a,b)=>Math.round((Date.UTC(...b.split("-").map((x,i)=>i==1?x-1:+x))-Date.UTC(...a.split("-").map((x,i)=>i==1?x-1:+x)))/864e5)+1;
function stato(v,oggi){return v.annullato?["Annullata","p-bad"]:v.usate>=v.qta?["Ritirata","p-ok"]:fine(v)<oggi?["Scaduta","p-bad"]:v.data>oggi?["Programmata","p-warn"]:["In corso","p-warn"]}
function download(name,text,type="text/csv"){const a=document.createElement("a");a.href=URL.createObjectURL(new Blob(["﻿"+text],{type}));a.download=name;a.click()}
const csvRows=rows=>rows.map(r=>r.map(x=>`"${String(x??"").replace(/"/g,'""')}"`).join(";")).join("\n");
/* stampa schede con QR */
function stampa(items){
 document.getElementById("printarea")?.remove();
 const d=document.createElement("div");d.id="printarea";
 d.innerHTML=items.map((c,i)=>`<div class="pcard"><small>${esc(c.sopra||"")}</small><h3>${esc(c.titolo)}</h3><div>${esc(c.riga||"")}</div><div class="qr" id="pq${i}"></div><b style="font-size:16pt;letter-spacing:2px">${esc(c.codice||"")}</b><div><small>${esc(c.sotto||"")}</small></div></div>`).join("");
 document.body.appendChild(d);items.forEach((c,i)=>qr(document.getElementById("pq"+i),c.qr,170));
 setTimeout(()=>{print()},250)}
const cardVoucher=(v,menu,struttura)=>({sopra:struttura,titolo:camNome(v),riga:(v.camera?ospTxt(v.ospiti||1):`${v.qta} colazion${v.qta>1?"i":"e"}`)+` · ${dRange(v)}`,qr:v.id,codice:v.id,sotto:menu||"Mostra questo QR al bar"});

const hero=(nome,sfondo,msg)=>`<div class="hero" style="${sfondo?`background-image:linear-gradient(rgba(0,0,0,.30),rgba(0,0,0,.60)),url('${esc(sfondo)}')`:""}"><h1>${esc(nome)}</h1>${msg?`<p>${esc(msg)}</p>`:""}</div>`;
function home(){
 $("#ttl").textContent="☕ Colazioni B&B";
 app.innerHTML=`<div class="hero"><h1>Colazioni per i B&B</h1><p>Bar Pasticceria Ceraldi · Napoli</p></div>
 <div class="card"><p>Se sei un albergatore, apri il <b>link personale</b> che ti ha inviato il bar: lì trovi il tuo accesso.</p><p class="mute">Se sei un ospite, apri il link o il QR che ti ha dato il tuo albergo.</p></div>
 <p style="text-align:center"><a class="mute" href="#/titolare">Area riservata del bar</a></p>`}

/* ============ ACCESSO DELL'ALBERGATORE (link personale e invito) ============ */
async function hotelLogin(cod){
 $("#ttl").textContent="☕ Colazioni B&B";loading();
 const h=await rpc("bb_hotel_info",{codice:cod||""}).catch(()=>null);
 if(!h){app.innerHTML=`<div class="card">Link non valido. Chiedi al bar di inviartene uno nuovo.</div>`;return}
 if(sess&&sess.r==="alb"&&sess.s===h.id){go("#/albergatore/home");return}
 if(!h.attivo){app.innerHTML=hero(h.nome,h.sfondo,"")+`<div class="card">L'accesso non è ancora attivo. Usa il <b>link di invito</b> che ti ha inviato il bar.</div>`;return}
 app.innerHTML=hero(h.nome,h.sfondo,h.benvenuto)+`<div class="card"><label>PIN</label><input id="lp" type="password" inputmode="numeric" autocomplete="current-password" onkeydown="if(event.key==='Enter')hotelEntra('${h.id}','${esc(cod)}')"><button class="btn" onclick="hotelEntra('${h.id}','${esc(cod)}')">Entra</button>
  <p style="text-align:center;margin:12px 0 0"><a href="#/recupero/${esc(cod)}">Ho perso il PIN</a></p></div>`}
async function hotelEntra(id,cod){
 const pin=$("#lp")?$("#lp").value:"";if(!pin)return toast("Scrivi il tuo PIN");
 const r=await run("bb_alb_login",{paccesso:cod,ppin:pin});if(!r||r===true)return;
 if(!r.ok){toast(r.msg||"PIN errato");if($("#lp"))$("#lp").value="";return}
 setSess({r:"alb",s:r.sid,p:r.token,c:cod});go("#/albergatore/home")}
/* --- recupero del PIN: codice di recupero, oppure richiesta al bar --- */
async function recupero(cod){
 $("#ttl").textContent="☕ Colazioni B&B";loading();
 const h=await rpc("bb_hotel_info",{codice:cod||""}).catch(()=>null);
 if(!h||!h.attivo){app.innerHTML=`<div class="card">Link non valido. Chiedi al bar di inviartene uno nuovo.</div>`;return}
 app.innerHTML=hero(h.nome,h.sfondo,"")+`<div class="card"><h3>Recupera il tuo accesso</h3>
  <p class="mute">Scrivi il <b>codice di recupero</b> che hai ricevuto quando hai attivato l'accesso (sono 8 caratteri, per esempio K7QM-2XPD) e scegli un nuovo PIN.</p>
  <label>Codice di recupero</label><input id="rc" autocapitalize="characters" autocomplete="off" placeholder="XXXX-XXXX">
  <label>Nuovo PIN (almeno 4 caratteri)</label><input id="rp" type="password" autocomplete="new-password"><label>Ripeti il nuovo PIN</label><input id="rp2" type="password" autocomplete="new-password">
  <button class="btn" onclick="recuperoOk('${esc(cod)}')">Imposta il nuovo PIN</button></div>
  <div class="card"><h3>Non trovi il codice?</h3><p class="mute">Chiedi al bar: ti manda un nuovo link per scegliere un PIN.</p>
  <label>Un recapito (facoltativo)</label><input id="ra" placeholder="il tuo numero, se diverso da quello del bar"><button class="btn sec" onclick="recuperoAiuto('${esc(cod)}')">Chiedi aiuto al bar</button>
  <p style="text-align:center;margin:12px 0 0"><a href="#/hotel/${esc(cod)}">← Torna all'accesso</a></p></div>`}
async function recuperoOk(cod){
 const n=$("#rp").value;if(n!==$("#rp2").value)return toast("I due PIN non coincidono");
 const r=await run("bb_alb_recupera",{paccesso:cod,pcodice:$("#rc").value,pnuovo:n});if(!r||r===true)return;
 if(!r.ok)return toast(r.msg||"Codice errato");
 setSess({r:"alb",s:r.sid,p:r.token,c:cod});codiceRecupero(r.recupero,"Nuovo PIN impostato ✓")}
async function recuperoAiuto(cod){
 if(await run("bb_alb_richiedi_aiuto",{paccesso:cod,pnota:$("#ra").value}))app.innerHTML=`<div class="card"><h3>Richiesta inviata ✓</h3><p>Il bar l'ha ricevuta: ti manderà un nuovo link per scegliere il PIN. Quando lo apri, potrai impostarlo subito.</p><a class="btn" style="display:inline-block;text-decoration:none" href="#/hotel/${esc(cod)}">Torna all'accesso</a></div>`}
/* schermata del codice di recupero: si mostra una volta sola */
function codiceRecupero(codice,titolo){
 $("#ttl").textContent="☕ Colazioni B&B";
 app.innerHTML=`<div class="card" style="text-align:center"><h3>${esc(titolo||"Accesso attivato ✓")}</h3>
  <p>Questo è il tuo <b>codice di recupero</b>. Se un giorno perdi il PIN, con questo codice ne scegli uno nuovo senza chiamare nessuno.</p>
  <div style="font-size:32px;font-weight:800;letter-spacing:4px;margin:14px 0">${esc(codice)}</div>

function pMenu(){
 return `<div class="card"><h3>🥐 Colazioni standard</h3><p class="mute">Il tuo listino di base. In ogni struttura le importi con un tocco e poi le personalizzi (prezzo, prodotti) senza toccare le standard. Tocca una colazione per modificarla.</p><div id="ce2"></div></div><div id="glwrap"></div>`}
pMenu.after=async()=>{ceInit("std");const l=await rpc("bb_glutine_pubblico").catch(()=>[]);GL=l.map(x=>({nome:x.nome,differenza:x.differenza,per:x.per}));$("#glwrap").innerHTML=glHtml();glTab()};
let GL=[];
function glHtml(){return `<div class="card"><h3>🌾 Versioni senza glutine</h3><p class="mute">I prodotti senza glutine che l'ospite può scegliere al posto di quello del menù. Scrivi <b>solo la differenza da pagare</b> (0 se non c'è supplemento). "Per" è facoltativo: una parola del prodotto a cui si riferisce (es. cornetto), così viene proposto solo su quello.</p>
 <div id="gl"></div><div class="row" style="justify-content:flex-start;flex-wrap:wrap;gap:6px"><button class="btn sm sec" onclick="GL.push({nome:'',differenza:0,per:''});glTab()">+ Aggiungi</button><button class="btn" onclick="glSalva()">Salva elenco</button></div>
 <label style="margin-top:14px">Oppure incolla l'elenco (una riga per prodotto: nome ; differenza ; per)</label><textarea id="glt" rows="4" placeholder="Cornetto senza glutine;1,50;cornetto&#10;Pane senza glutine;0,80"></textarea><button class="btn sm sec" onclick="glImporta()">Aggiungi dall'elenco incollato</button></div>`}
function glTab(){$("#gl").innerHTML=GL.length?`<div class="scroll"><table><tr><th>Prodotto senza glutine</th><th>Differenza €</th><th>Per</th><th></th></tr>${GL.map((g,i)=>`<tr><td><input value="${esc(g.nome)}" oninput="GL[${i}].nome=this.value" style="margin:0;min-width:180px"></td><td><input type="number" step="0.10" min="0" value="${g.differenza}" oninput="GL[${i}].differenza=+this.value" style="margin:0;width:90px"></td><td><input value="${esc(g.per)}" oninput="GL[${i}].per=this.value" style="margin:0;width:110px" placeholder="(tutti)"></td><td><button class="btn sm sec" onclick="GL.splice(${i},1);glTab()">✕</button></td></tr>`).join("")}</table></div>`:`<p class="mute">Nessun prodotto ancora: finché l'elenco è vuoto, l'ospite può solo chiedere una versione senza glutine e il bar la conferma al ritiro.</p>`}
function glImporta(){const r=$("#glt").value.split(/\r?\n/).map(l=>l.trim()).filter(Boolean).map(l=>{const c=l.split(l.includes(";")?";":"\t").map(x=>x.trim());return {nome:c[0]||"",differenza:parseFloat(String(c[1]||"0").replace("€","").replace(",","."))||0,per:c[2]||""}}).filter(x=>x.nome);if(!r.length)return toast("Nessuna riga valida");GL.push(...r);$("#glt").value="";glTab();toast(r.length+" prodotti aggiunti: ricorda di salvare")}
async function glSalva(){const n=await run("bb_tit_glutine_salva",{p:sess.p,righe:GL.filter(g=>g.nome.trim())},"Elenco senza glutine salvato");if(n!==undefined&&n!==true)toast(n+" prodotti salvati")}

let CE=[],CESAVED=[],CEOPEN=-1,CESID=null,CATA=null,CEJ=null;
const ceCopy=x=>JSON.parse(JSON.stringify(x));
function ceInit(sid,open=-1){CESID=sid;CESAVED=ceCopy(sid==="std"?(TIT.standard||[]):sid?((TIT.colazioni||{})[sid]||[]):[]);CE=ceCopy(CESAVED);CEOPEN=open;ceTab();ceCat()}
async function ceCat(){if(CATA)return;const c=await rpc("bb_catalogo").catch(()=>null);if(Array.isArray(c)){CATA=c;loadXtra();ceTab()}}
const ceList=v=>{const p=CATA&&v.prodotto_id?CATA.find(x=>x.id===v.prodotto_id):null;return p?p.prezzo:null};
const cePz=v=>v.prezzo!=null?v.prezzo:ceList(v);
const ceSomma=c=>Math.round(c.voci.reduce((a,v)=>a+(cePz(v)||0)*v.qta,0)*100)/100;
const ceSumHtml=(c,i)=>{const t=ceSomma(c);return t>0&&t!==c.prezzo?`Somma delle voci: <b>${eur(t)}</b> · <a href="#" onmousedown="event.preventDefault();ceUsa(${i})" onclick="return false">usa come prezzo</a>`:""};
const ceUsa=i=>{CE[i].prezzo=ceSomma(CE[i]);ceTab()};
const ceSumRef=i=>{const e=document.getElementById("cesum"+i);if(e)e.innerHTML=ceSumHtml(CE[i],i)};
const ceRiga=c=>({id:c.id||null,nome:c.nome.trim(),prezzo:c.prezzo,descrizione:(c.descrizione||"").trim(),attiva:c.attiva,voci:c.voci.map(v=>({nome:v.nome.trim(),qta:v.qta,prodotto_id:v.prodotto_id,prezzo:v.prezzo,ingredienti:v.ingredienti,allergeni:v.allergeni}))});
const ceSporca=c=>{if(!c.id)return true;const s=CESAVED.find(x=>x.id===c.id);return !s||JSON.stringify(ceRiga(c))!==JSON.stringify(ceRiga(s))};
function ceCheck(c){
 if(!c.nome.trim()){toast("Scrivi il nome della colazione");return false}
 if(!(c.prezzo>=0)){toast("Prezzo non valido");return false}
 if(c.voci.some(v=>!v.nome.trim())){toast("Ogni voce deve avere un nome");return false}
 return true}
function ceRighe(){for(const c of CE)if(!ceCheck(c))return null;return CE.map(ceRiga)}
function ceOpen(i){CEOPEN=CEOPEN===i?-1:i;ceTab();const e=document.getElementById("cec"+i);if(e&&CEOPEN===i)e.scrollIntoView({block:"nearest",behavior:"smooth"})}
function ceAdd(){CE.push({nome:"",prezzo:5,descrizione:"",attiva:true,voci:[]});CEOPEN=CE.length-1;ceTab();const e=document.getElementById("cec"+CEOPEN);if(e){e.scrollIntoView({block:"nearest"});const n=e.querySelector("input");if(n)n.focus()}}
function ceModello(f){if(!f)return;const v=((TIT.voci||{})[f]||[]).map(x=>({nome:x.nome,qta:x.qta,prodotto_id:x.prodotto_id,prezzo:null,ingredienti:[...x.ingredienti],allergeni:[...x.allergeni]}));CE.push({nome:"Colazione da €"+String(f).replace(".",","),prezzo:+f,descrizione:"",attiva:true,voci:v});CEOPEN=CE.length-1;ceTab()}
function ceTab(){
 const A=tA(),al=TIT.allergeni_elenco||[],el=$("#ce2");if(!el)return;
 const chiusa=(c,i)=>`<div class="card row" id="cec${i}" onclick="ceOpen(${i})" style="cursor:pointer;margin:6px 0;padding:10px 14px;${c.attiva?"":"opacity:.6"}"><div style="min-width:0"><b>${esc(c.nome||"(senza nome)")}</b> ${c.attiva?"":`<span class="pill p-warn">disattivata</span> `}${ceSporca(c)?`<span class="pill p-warn">da salvare</span>`:""}
   <div class="mute" style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(c.voci.map(v=>(v.qta>1?v.qta+"× ":"")+v.nome).join(" · ")||"nessuna voce")}</div></div><span class="price" style="font-size:18px">${eur(c.prezzo)}</span></div>`;
 const aperta=(c,i)=>`<div class="card" id="cec${i}" style="margin:6px 0;padding:12px 14px;border-color:var(--brand,#7a2e1c)">
  <div class="row" style="gap:6px;align-items:center"><input value="${esc(c.nome)}" placeholder="Nome (es. Colazione Vesuvio)" oninput="CE[${i}].nome=this.value" style="margin:0;font-weight:700"><input type="number" min="0" step="0.1" value="${c.prezzo}" oninput="CE[${i}].prezzo=+this.value" style="margin:0;width:88px" title="Prezzo a persona in €"><span>€</span><a href="#" onclick="ceOpen(${i});return false" title="Chiudi" style="text-decoration:none">▲</a></div>
  <input value="${esc(c.descrizione||"")}" oninput="CE[${i}].descrizione=this.value" placeholder="Descrizione breve (facoltativa)" style="margin:6px 0">
  ${c.voci.map((v,j)=>`<div style="border-top:1px solid var(--line,#0002);padding:6px 0"><div class="row" style="gap:6px;align-items:center">
    <div style="flex:1;min-width:0">${v.prodotto_id?`<b>${esc(v.nome)}</b> <a href="#" onclick="cePick(${i},${j});return false" title="Sostituisci con un altro prodotto">cambia</a><div class="mute">${v.allergeni.map(a=>esc((A[a]||{}).icon||"")).join(" ")||"nessun allergene"}</div>`:`<input value="${esc(v.nome)}" oninput="CE[${i}].voci[${j}].nome=this.value" placeholder="Nome della voce" style="margin:0">`}</div>
    <div class="stepper"><button onclick="ceVQ(${i},${j},-1)">−</button><b>${v.qta}</b><button onclick="ceVQ(${i},${j},1)">+</button></div>
    <input type="number" min="0" step="0.1" value="${v.prezzo!=null?v.prezzo:""}" placeholder="${ceList(v)!=null?ceList(v):"0"}" title="Prezzo di questa voce (vuoto = listino)" oninput="CE[${i}].voci[${j}].prezzo=this.value===''?null:+this.value;ceSumRef(${i})" style="margin:0;width:74px">
    <button class="btn sm sec" onclick="CE[${i}].voci.splice(${j},1);ceTab()" title="Togli">✕</button></div>
   ${v.prodotto_id?"":`<details style="margin-top:4px"><summary class="mute">Ingredienti e allergeni</summary><input value="${esc(v.ingredienti.join(", "))}" onchange="CE[${i}].voci[${j}].ingredienti=this.value.split(',').map(x=>x.trim()).filter(Boolean)" placeholder="Ingredienti che l'ospite può togliere (es. uova, bacon)"><div class="tabs" style="flex-wrap:wrap">${al.map(a=>`<button class="${v.allergeni.includes(a.id)?"on":""}" onclick="ceAll(${i},${j},'${a.id}')">${a.icon} ${esc(a.nome)}</button>`).join("")}</div></details>`}</div>`).join("")||`<p class="mute" style="margin:6px 0">Nessuna voce: aggiungi i prodotti.</p>`}
  <div id="cesum${i}" class="mute">${ceSumHtml(c,i)}</div>
  <div class="row" style="justify-content:flex-start;flex-wrap:wrap;gap:6px;margin-top:6px"><button class="btn sm sec" onclick="cePick(${i})">+ Prodotto dal menù</button><button class="btn sm sec" onclick="CE[${i}].voci.push({nome:'',qta:1,prodotto_id:null,prezzo:null,ingredienti:[],allergeni:[]});ceTab()">+ Voce libera</button></div>
  <div id="cep${i}"></div>
  <div class="row" style="margin-top:10px"><span><label style="margin:0;display:inline-flex;gap:6px;align-items:center"><input type="checkbox" ${c.attiva?"checked":""} onchange="CE[${i}].attiva=this.checked" style="width:auto;margin:0"> Attiva</label> · <a href="#" onclick="ceDel(${i});return false">Elimina</a></span>
   <button class="btn" onclick="${CESID?`ceSalvaUno(${i})`:`ceOpen(${i})`}">${CESID?"Salva questa colazione":"Fatto"}</button></div></div>`;
 el.innerHTML=CE.map((c,i)=>i===CEOPEN?aperta(c,i):chiusa(c,i)).join("")||`<p class="mute">Nessuna colazione ancora.</p>`;
 el.innerHTML+=`<div class="row" style="justify-content:flex-start;flex-wrap:wrap;gap:6px;margin-top:8px"><button class="btn sm" onclick="ceAdd()">+ Nuova colazione</button>${CESID!=="std"&&(TIT.standard||[]).some(c=>c.attiva)?`<select id="ce_imp" onchange="ceImporta(this.value)" style="width:auto;margin:0"><option value="">📥 Importa dalle standard…</option>${CESID?`<option value="*">Importa tutte le standard</option>`:""}${(TIT.standard||[]).filter(c=>c.attiva).map(c=>`<option value="${c.id}">${esc(c.nome)} · ${eur(c.prezzo)}</option>`).join("")}</select>`:""}</div>`}
function ceVQ(i,j,d){const v=CE[i].voci[j];v.qta=Math.min(10,Math.max(1,v.qta+d));ceTab()}
function ceAll(i,j,a){const x=CE[i].voci[j].allergeni,k=x.indexOf(a);k<0?x.push(a):x.splice(k,1);ceTab()}
async function cePick(i,j){CEJ=j===undefined?null:j;
 if(!CATA){const c=await run("bb_catalogo");if(!c||c===true)return;CATA=c;loadXtra()}
 $("#cep"+i).innerHTML=`<div class="card" style="margin:8px 0;padding:8px"><input id="mq" placeholder="${CEJ!==null?"Cerca il prodotto che lo sostituisce…":"Cerca nel menù (es. croissant, cappuccino…)"}" oninput="ceRes(${i})" style="margin:0 0 6px"><div id="mr" style="max-height:320px;overflow:auto"></div></div>`;$("#mq").focus();ceRes(i)}
function ceRes(i){
 const q=$("#mq").value.toLowerCase(),A=tA(),l=CATA.filter(p=>!q||p.nome.toLowerCase().includes(q)).slice(0,60);
 $("#mr").innerHTML=l.map(p=>`<div class="prod" style="cursor:pointer" onclick="ceAdd2(${i},${p.id})">${prodImg(p)}<div class="pinfo"><b>${esc(p.nome)}</b><div class="mute">${esc(p.sub||p.cat)} · ${eur(p.prezzo)} · ${p.allergeni.map(a=>(A[a]||{}).icon||"").join("")}</div></div><span class="btn sm">${CEJ!==null?"Scegli":"Aggiungi"}</span></div>`).join("")||`<p class="mute">Nessun risultato.</p>`}
function ceAdd2(i,id){const p=CATA.find(x=>x.id===id);
 if(CEJ!==null){const v=CE[i].voci[CEJ];v.nome=p.nome;v.prodotto_id=p.id;v.allergeni=p.allergeni;v.ingredienti=[];CEJ=null;ceTab();return toast("Sostituito con: "+p.nome)}
 const k=CE[i].voci.find(v=>v.prodotto_id===id);if(k)k.qta=Math.min(10,k.qta+1);else CE[i].voci.push({nome:p.nome,qta:1,prodotto_id:p.id,ingredienti:[],allergeni:p.allergeni,prezzo:null});
 const q=$("#mq").value;ceTab();toast("Aggiunto: "+p.nome);cePick(i).then(()=>{$("#mq").value=q;ceRes(i)})}
async function ceInvia(righe,ok){
 const r=await run("bb_tit_colazioni_salva",{p:sess.p,sid:CESID==="std"?null:CESID,righe},ok);if(!r||r===true)return null;
 CESAVED=ceCopy(r);if(CESID==="std")TIT.standard=ceCopy(r);else(TIT.colazioni=TIT.colazioni||{})[CESID]=ceCopy(r);return r}
function ceImporta(v){
 const sel=document.getElementById("ce_imp");if(sel)sel.value="";
 if(!v)return;const std=(TIT.standard||[]).filter(c=>c.attiva);
 const gia=new Set(CE.map(c=>c.nome.trim().toLowerCase()));const lista=v==="*"?std.filter(c=>!gia.has(c.nome.trim().toLowerCase())):std.filter(c=>c.id===v);if(!lista.length)return toast("Le hai già tutte");
 lista.forEach(c=>CE.push({nome:c.nome,prezzo:c.prezzo,descrizione:c.descrizione||"",attiva:true,voci:ceCopy(c.voci).map(x=>({nome:x.nome,qta:x.qta,prodotto_id:x.prodotto_id,prezzo:x.prezzo!=null?x.prezzo:null,ingredienti:x.ingredienti||[],allergeni:x.allergeni||[]}))}));
 if(v==="*"&&CESID&&CESID!=="std"){ceSalvaTutte();return}
 CEOPEN=CE.length-1;ceTab();toast(lista.length>1?lista.length+" colazioni importate":"Importata: personalizzala e salva")}
async function ceSalvaTutte(){
 if(CE.length>30)return toast("Massimo 30 colazioni per struttura: importane meno");
 const nuove=CE.filter(x=>!x.id);for(const c of nuove)if(!ceCheck(c))return;
 const modif=new Map(CE.filter(x=>x.id&&ceSporca(x)).map(x=>[x.id,ceCopy(x)]));
 const righe=CE.map(x=>x.id?ceRiga(CESAVED.find(y=>y.id===x.id)||x):ceRiga(x));
 const r=await ceInvia(righe,"Colazioni standard importate");if(!r)return;
 CE=ceCopy(r).map(x=>modif.get(x.id)||x);CEOPEN=-1;ceTab()}
async function ceSalvaUno(i){
 const c=CE[i];if(!ceCheck(c))return;
 const vecchi=new Set(CESAVED.map(x=>x.id)),righe=[];
 CE.forEach((x,k)=>{if(k===i)righe.push(ceRiga(x));else{const s=x.id&&CESAVED.find(y=>y.id===x.id);if(s)righe.push(ceRiga(s))}});
 const r=await ceInvia(righe,"Colazione salvata");if(!r)return;
 const nuova=c.id?r.find(y=>y.id===c.id):r.find(y=>!vecchi.has(y.id));
 if(nuova)CE[i]=ceCopy(nuova);
 CEOPEN=i;ceTab()}
async function ceDel(i){
 const c=CE[i];if(!confirm("Eliminare «"+(c.nome||"senza nome")+"»?"))return;
 if(!CESID||!c.id){CE.splice(i,1);CEOPEN=-1;ceTab();return}
 const righe=[];CE.forEach((x,k)=>{if(k!==i){const s=x.id&&CESAVED.find(y=>y.id===x.id);if(s)righe.push(ceRiga(s))}});
 const r=await ceInvia(righe,"Eliminata");if(!r)return;
 if(r.find(y=>y.id===c.id)){CE[i]=ceCopy(r.find(y=>y.id===c.id));toast("Già usata da alcune colazioni: l'ho disattivata invece di eliminarla")}else CE.splice(i,1);
 CEOPEN=-1;ceTab()}

 <div class="card"><h3>📏 Regole di vendita</h3>

 ${f("supplemento_tavolo","Supplemento servizio al tavolo (€ a persona, per colazione)","es. 1,50","text","Si aggiunge al prezzo della colazione per gli alberghi con il servizio al tavolo spuntato. Vale per le prenotazioni nuove.")}
 ${f("ordini_limite_ora","Orario limite per ordinare il giorno prima","es. 20:00","time","Vuoto = nessun limite. Con 20:00, le colazioni per domani si possono creare fino alle 20:00 di oggi (e quindi mai per lo stesso giorno).")}</div>
 <div class="card"><h3>💬 Messaggio all'ospite</h3><p class="mute">Testo proposto quando l'albergatore preme "Invia all'ospite". Puoi usare <b>{ospite}</b>, <b>{bar}</b> e <b>{link}</b>.</p>
 <textarea rows="3" onchange="salvaCfg('msg_ospite',this.value)">${esc(c.msg_ospite||"")}</textarea></div>
 <div class="card"><h3>📨 Messaggio di invito ai B&B</h3><p class="mute">Testo proposto quando inviate il link a un nuovo B&B. Puoi usare <b>{hotel}</b>, <b>{bar}</b> e <b>{link}</b>.</p>
 <textarea rows="3" onchange="salvaCfg('msg_invito',this.value)">${esc(c.msg_invito||"")}</textarea></div>
 <div class="card"><h3>💳 Pagamenti con carta (SumUp)</h3>
 ${TIT.sumup?`<div class="alert ok"><b>✅ Attivo</b>${c.sumup_merchant_code?` · codice esercente <b>${esc(c.sumup_merchant_code)}</b>`:""}<br>Gli albergatori possono ricaricare il borsellino con carta e il saldo si aggiorna da solo.</div>
 <p class="mute">Per cambiare chiave, incollane una nuova qui sotto.</p>`:`<div class="alert"><b>Non ancora attivo.</b> Gli albergatori pagano al bar e tu confermi con "Incassata".</div>
 <p class="mute"><b>Come attivarlo (una volta sola):</b><br>1. Apri Render → il servizio del gestionale → <i>Environment</i>.<br>2. Trova la variabile di SumUp (nome con SUMUP) e copia il valore.<br>3. Incollalo qui sotto e premi Attiva.</p>`}
 <label>Chiave API SumUp</label><input id="sk" type="password" autocomplete="off" placeholder="incolla qui la chiave">
 <button class="btn" onclick="attivaSumup()">${TIT.sumup?"Aggiorna chiave":"Attiva pagamenti"}</button> ${TIT.sumup?`<button class="btn sec" onclick="rimuoviSumup()">Disattiva e cancella la chiave</button>`:""}
 <p class="mute">La chiave viene controllata con SumUp e salvata cifrata sul server: non viene mai più mostrata né inviata ai browser. Il codice esercente lo ricavo io dal tuo conto.</p></div>
 <div class="card"><h3>🔌 Stato dei collegamenti</h3><p class="mute">Controlla che database, SumUp, navi e scioperi funzionino.</p><button class="btn" onclick="diagnostica()">Controlla ora</button><div id="dg" style="margin-top:10px"></div></div>
 <div class="card"><h3>🔒 Accesso</h3><p class="mute">Il titolare entra con lo stesso PIN del gestionale: per cambiarlo si usa il gestionale. Gli albergatori scelgono il PIN da soli quando attivano l'accesso e possono recuperarlo con il loro codice di recupero. Se lo perdono del tutto, ti arriva una richiesta nel Cruscotto.</p></div>
 <div class="card"><h3>🧪 Dati di prova</h3><p class="mute">${demo?`Ci sono ${demo} strutture dimostrative (PIN 1111, 2222, 3333) con ordini fittizi. Quando inizi con i dati veri, eliminale.`:"Nessun dato di prova presente."}</p>
 ${demo?`<button class="btn bad" onclick="eliminaDemo()">Elimina tutti i dati di prova</button>`:""}</div>`}
const salvaCfg=async(k,v)=>{if(await run("bb_tit_config_set",{p:sess.p,pk:k,pv:v},"Salvato")!==undefined&&TIT.config)TIT.config[k]=v.trim()};
async function diagnostica(){
 $("#dg").innerHTML=`<span class="mute">Controllo in corso…</span>`;
 const d=await run("bb_tit_diagnostica",{p:sess.p});if(!d)return $("#dg").innerHTML="";
 const riga=(ok,t,extra)=>`<div class="alert ${ok?"ok":"bad"}"><b>${ok?"✅":"❌"} ${t}</b>${extra?`<br><span class="mute">${extra}</span>`:""}</div>`;
 const t=x=>x?new Date(x).toLocaleString("it-IT",{timeZone:"Europe/Rome"}):"mai";
 $("#dg").innerHTML=riga(d.database.ok,"Database",`${d.database.strutture} strutture · ${d.database.ordini} ordini`)+
  riga(d.sumup.ok,"SumUp",d.sumup.ok?`esercente ${esc(d.sumup.merchant||"")} ${esc(d.sumup.nome||"")}`:esc(d.sumup.errore||("errore "+d.sumup.stato)))+
  riga(d.navi.ok,"Navi in porto",`${d.navi.n} passeggeri/traghetti in elenco · aggiornato ${t(d.navi.aggiornato)}${d.navi.errore?" · "+esc(d.navi.errore):""}`)+
  riga(d.scioperi.ok,"Scioperi",`${d.scioperi.n} in elenco · aggiornato ${t(d.scioperi.aggiornato)}${d.scioperi.errore?" · "+esc(d.scioperi.errore):""}`)}
async function attivaSumup(){const p=pinStrict();if(!p)return;const r=await run("bb_tit_sumup_configura",{p,chiave:$("#sk").value});if(r){toast("SumUp attivo"+(r.nome?" · "+r.nome:""));render()}}
async function rimuoviSumup(){if(!confirm("Disattivare i pagamenti con carta e cancellare la chiave?"))return;const p=pinStrict();if(!p)return;if(await run("bb_tit_sumup_rimuovi",{p},"Disattivato"))render()}
async function eliminaDemo(){if(!confirm("Eliminare tutte le strutture e gli ordini di prova?"))return;const p=pinStrict();if(!p)return;const n=await run("bb_tit_elimina_demo",{p});if(n!==undefined){toast(n+" strutture eliminate");render()}}

render();
