name: Backend tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Installa dipendenze backend
        run: pip install -r backend/requirements.txt

      - name: Suite di test (incl. route-map-consistency, endpoint-classification, anti-hardcode collection)
        run: python -m pytest -q

      - name: Mappe rigenerate == mappe committate (nessuna route cambiata senza rigenerare)
        run: |
          python scripts/genera_mappa.py
          python scripts/genera_classificazione_endpoint.py
          git diff --exit-code -- memoria/MAPPA_ROUTER.md memoria/MAPPA_ENDPOINT_COMPLETA.md memoria/ENDPOINT_CLASSIFICAZIONE_FINALE.md || {
            echo "::error::Le mappe generate non coincidono con quelle committate. Rilancia 'python scripts/genera_mappa.py && python scripts/genera_classificazione_endpoint.py' e committa il risultato.";
            exit 1;
          }
