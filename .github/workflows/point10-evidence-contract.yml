name: Point 10 POS PayPal evidence contract

on:
  push:
    paths:
      - ".github/workflows/point10-evidence-contract.yml"
      - ".github/scripts/point10_patch.py"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ai/prompt-governance-supabase
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install backend dependencies
        run: pip install -r backend/requirements.txt
      - name: Apply point 10 patch
        run: python .github/scripts/point10_patch.py
      - name: Focused tests
        run: |
          python -m pytest -q \
            tests/test_point10_pos_paypal_evidence_contract.py \
            tests/test_coerenza_pos_accrediti.py \
            tests/test_sumup_payout.py \
            tests/test_paypal_reconciliation_end_to_end.py
      - name: Commit point 10 fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/services/sumup_payout.py tests/test_point10_pos_paypal_evidence_contract.py
          if git diff --cached --quiet; then
            echo "No point 10 changes"
            exit 0
          fi
          git commit -m "fix: separate provider settlements from bank evidence"
          git push origin HEAD:ai/prompt-governance-supabase
