name: Point 11 assets and CDC

on:
  push:
    paths:
      - ".github/workflows/point11-assets-cdc.yml"
      - ".github/scripts/point11_assets_cdc_patch.py"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ai/prompt-governance-supabase
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r backend/requirements.txt
      - name: Apply point 11 assets and CDC patch
        run: python .github/scripts/point11_assets_cdc_patch.py
      - name: Run focused regression tests
        run: |
          python -m pytest -q \
            tests/test_point11_assets_cdc.py \
            tests/test_point11_accounting_governance.py \
            tests/test_point11_budget_consistency.py \
            tests/test_cespiti_auto_da_fattura.py \
            tests/test_fattura_passiva_regole_5_9.py
      - name: Commit point 11 assets and CDC patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/routers/accounting/bilancio.py app/routers/accounting/centri_costo.py tests/test_point11_assets_cdc.py
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "fix: align assets amortization and line-level cost centers"
          git push origin HEAD:ai/prompt-governance-supabase
