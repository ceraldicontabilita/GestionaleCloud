name: Refresh endpoint map point 5
on:
  push:
    branches: [ai/prompt-governance-supabase]
    paths: [.github/workflows/refresh-endpoint-map-point5.yml]
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ai/prompt-governance-supabase
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r backend/requirements.txt
      - run: python scripts/genera_classificazione_endpoint.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add memoria/ENDPOINT_CLASSIFICAZIONE_FINALE.md
          git commit -m "docs: align endpoint classification after point 5" || exit 0
          git push origin HEAD:ai/prompt-governance-supabase
