name: Point 10 align legacy SumUp tests

on:
  push:
    paths:
      - ".github/workflows/point10-align-legacy-sumup-tests.yml"
      - ".github/scripts/point10_update_legacy_sumup_tests.py"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ai/prompt-governance-supabase
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r backend/requirements.txt
      - name: Apply legacy-test alignment
        run: python .github/scripts/point10_update_legacy_sumup_tests.py
      - name: Run affected tests
        run: |
          python -m pytest -q \
            tests/test_accrediti_numia_da_csv.py \
            tests/test_bonifica_accrediti_pos_numia.py \
            tests/test_motore_unico_scritture.py \
            tests/test_pos_multi_gestore.py \
            tests/test_sumup_sync.py \
            tests/test_point10_sumup_separate_register.py
      - name: Commit aligned tests
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/test_accrediti_numia_da_csv.py tests/test_bonifica_accrediti_pos_numia.py tests/test_motore_unico_scritture.py tests/test_pos_multi_gestore.py tests/test_sumup_sync.py
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "test: align SumUp register expectations"
          git push origin HEAD:ai/prompt-governance-supabase
