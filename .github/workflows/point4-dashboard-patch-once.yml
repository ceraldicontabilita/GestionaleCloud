name: Point4 dashboard patch once

on:
  push:
    branches:
      - ai/prompt-governance-supabase
    paths:
      - .github/workflows/point4-dashboard-patch-once.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ai/prompt-governance-supabase
          fetch-depth: 0
      - name: Collega fascia operativa alla dashboard
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('frontend/src/pages/Dashboard.jsx')
          text = p.read_text(encoding='utf-8')
          import_old = "import { PageLayout } from '../components/PageLayout';\n"
          import_new = import_old + "import DashboardOperativita from '../components/DashboardOperativita';\n"
          if "DashboardOperativita from '../components/DashboardOperativita'" not in text:
              if import_old not in text:
                  raise SystemExit('Import PageLayout non trovato')
              text = text.replace(import_old, import_new, 1)

          marker = "      <FasciaEnergiaCard energia={energia} errore={erroreEnergia} />"
          insertion = "      <DashboardOperativita scadenze={scadenze} erroriApi={erroriApi} />\n\n" + marker
          if '<DashboardOperativita scadenze={scadenze} erroriApi={erroriApi} />' not in text:
              if marker not in text:
                  raise SystemExit('Marker FasciaEnergiaCard non trovato')
              text = text.replace(marker, insertion, 1)

          p.write_text(text, encoding='utf-8')
          PY
      - name: Verifica patch
        run: |
          grep -q "DashboardOperativita" frontend/src/pages/Dashboard.jsx
          grep -q "dashboard-operativita" frontend/src/components/DashboardOperativita.jsx
      - name: Commit dashboard punto 4
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/src/pages/Dashboard.jsx
          if git diff --cached --quiet; then
            echo "Dashboard gia' collegata"
            exit 0
          fi
          git commit -m "feat: surface operational dashboard actions"
          git pull --rebase origin ai/prompt-governance-supabase
          git push origin HEAD:ai/prompt-governance-supabase
