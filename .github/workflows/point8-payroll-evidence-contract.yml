name: Point 8 payroll evidence contract

on:
  push:
    paths:
      - ".github/workflows/point8-payroll-evidence-contract.yml"
      - ".github/scripts/point8_patch.py"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ai/prompt-governance-supabase
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install dependencies
        run: |
          pip install -r backend/requirements.txt
          cd frontend
          yarn install --frozen-lockfile
      - name: Apply payroll evidence patch
        run: python .github/scripts/point8_patch.py
      - name: Focused backend tests
        run: >-
          python -m pytest -q
          tests/test_point8_payroll_evidence_contract.py
          tests/test_stipendi_bonifici.py
          tests/test_salari_sync_hr.py
          tests/test_import_bonifici_excel_storici.py
      - name: Frontend tests and build
        working-directory: frontend
        run: |
          yarn test
          yarn build
      - name: Regenerate audits and endpoint maps
        run: |
          python scripts/audit_frontend_dead_code.py
          python scripts/genera_mappa.py
          python scripts/genera_classificazione_endpoint.py
          python scripts/audit_frontend_backend_contract.py
          git status --short
      - name: Commit point 8 fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git reset .github/workflows/point8-payroll-evidence-contract.yml .github/scripts/point8_patch.py
          if git diff --cached --quiet; then
            echo "No point 8 changes"
            exit 0
          fi
          git commit -m "fix: separate payroll documents from bank evidence"
          git push origin HEAD:ai/prompt-governance-supabase
