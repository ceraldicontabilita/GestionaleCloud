# Compilazione e controllo segreti su push e pull request verso main.
name: CI

on:
  push:
    branches: [main]
    paths:
      - "frontend_hr/**"
      - "frontend_lotti/**"
      - "frontend_menu/**"
      - "frontend_shared/**"
      - "frontend_colazioni/**"
      - "supabase/migrations/**"
      - "scripts/build_frontends.sh"
      - "app/**"
      - "backend/**"
      - "frontend/**"
      - ".github/workflows/ci.yml"
      - ".gitleaks.toml"
  pull_request:
    branches: [main]
    paths:
      - "frontend_hr/**"
      - "frontend_lotti/**"
      - "frontend_menu/**"
      - "frontend_shared/**"
      - "frontend_colazioni/**"
      - "supabase/migrations/**"
      - "scripts/build_frontends.sh"
      - "app/**"
      - "backend/**"
      - "frontend/**"
      - ".github/workflows/ci.yml"
      - ".gitleaks.toml"

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  PYTHONUTF8: "1"

jobs:
  backend:
    name: Compilazione e analisi statica backend
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.10"
      - run: python -m pip install pyflakes==3.4.0
      - run: python -m compileall -q app scripts
      - run: python -m pyflakes app scripts
      - run: bash -n scripts/build_frontends.sh

  frontend:
    name: Build frontend ERP
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: yarn
          cache-dependency-path: frontend/yarn.lock
      - name: Installa dipendenze
        run: yarn install --frozen-lockfile
      - name: Build
        run: yarn build:erp

  # Render compila anche HR, Lotti e Menu (scripts/build_frontends.sh --apps):
  # qui si scopre prima del deploy se uno dei tre non compila.
  frontend_app:
    name: Build frontend HR, Lotti, Menu
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: |
            frontend_hr/package-lock.json
            frontend_lotti/package-lock.json
            frontend_menu/package-lock.json
      - name: Build
        run: bash scripts/build_frontends.sh --apps
  # Segreti nell'albero di lavoro (gitleaks, binario fissato: nessuna licenza
  # né azione di terzi). Dal 02/10/2026: la cronologia del repository ha
  # contenuto credenziali vere (backend/.env e file di memoria caricati fra
  # febbraio e aprile 2026); questo job impedisce che ne entrino di nuove. I
  # falsi positivi noti stanno in .gitleaks.toml. Scansiona solo i file
  # presenti, non la cronologia: quella si ripulisce con git filter-repo dopo
  # la rotazione delle credenziali, con l'ok del titolare.
  segreti:
    name: Segreti (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Scarica gitleaks
        env:
          GITLEAKS_VERSION: "8.21.2"
        run: |
          curl -sSL -o gitleaks.tgz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          tar xzf gitleaks.tgz gitleaks
      - name: Scansione dei file presenti
        run: ./gitleaks dir . --config .gitleaks.toml --no-banner --redact --exit-code 1
