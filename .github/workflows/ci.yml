# Controlli veloci su ogni push e ogni pull request verso main.
# I collaudi lenti (browser reale, esito del deploy) stanno in produzione.yml.
name: CI

on:
  push:
    branches: [main]
    paths:
      - "frontend_hr/**"
      - "frontend_lotti/**"
      - "frontend_menu/**"
      - "frontend_shared/**"
      - "scripts/build_frontends.sh"
      - "app/**"
      - "backend/**"
      - "frontend/**"
      - "tests/**"
      - ".github/workflows/ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "frontend_hr/**"
      - "frontend_lotti/**"
      - "frontend_menu/**"
      - "frontend_shared/**"
      - "scripts/build_frontends.sh"
      - "app/**"
      - "backend/**"
      - "frontend/**"
      - "tests/**"
      - ".github/workflows/ci.yml"

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  PYTHONUTF8: "1"

jobs:
  backend:
    name: Test backend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.10"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Installa dipendenze
        run: pip install -r backend/requirements.txt
      - name: Suite di test
        run: python -m pytest -q

  frontend:
    name: Test e build frontend ERP
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn
          cache-dependency-path: frontend/yarn.lock
      - name: Installa dipendenze
        run: yarn install --frozen-lockfile
      - name: Test
        run: yarn test
      - name: Build
        run: yarn build

  # Render compila anche HR, Lotti e Menu (scripts/build_frontends.sh --apps):
  # qui si scopre prima del deploy se uno dei tre non compila.
  frontend_app:
    name: Build frontend HR, Lotti, Menu
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            frontend_hr/package-lock.json
            frontend_lotti/package-lock.json
            frontend_menu/package-lock.json
      - name: Build
        run: bash scripts/build_frontends.sh --apps
