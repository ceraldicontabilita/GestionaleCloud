# Verifica che la produzione (impresasemplice.online) serva ESATTAMENTE il
# build committato in frontend/dist. Serve come conferma indipendente del
# deploy quando l'ambiente di sviluppo non può raggiungere il sito.
name: Verifica produzione

on:
  workflow_dispatch:
  # Auto: ogni push su main che tocca il build verificato (o questo file)
  # fa partire il controllo — il deploy si auto-verifica da solo.
  push:
    branches: [main]
    paths:
      - "frontend/dist/**"
      - ".github/workflows/verifica-produzione.yml"

jobs:
  verifica:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Bundle atteso (dal repo) vs bundle servito (dal sito)
        run: |
          set -e
          ATTESO=$(grep -o 'assets/index-[^"]*\.js' frontend/dist/index.html | head -1)
          DASH=$(ls frontend/dist/assets | grep '^Dashboard-' | head -1)
          echo "Bundle atteso: $ATTESO — chunk Dashboard: $DASH"

          # NB: la route "/" del backend serve l'index.html SOLO con
          # Accept: text/html (altrimenti risponde il JSON di stato API —
          # è così che il controllo trovava sempre '' a sito funzionante).
          # Verifichiamo /login, che passa dal catch-all SPA, e mandiamo
          # comunque l'header Accept da browser.
          UA="Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126 Safari/537.36"
          URL="https://impresasemplice.online/login"

          # Il deploy Render può richiedere qualche minuto: ritenta fino a ~10'
          for i in $(seq 1 20); do
            BODY=$(curl -sS --compressed -A "$UA" -H 'Accept: text/html' --max-time 20 "$URL" || true)
            CODE=$(curl -sS -o /dev/null -w '%{http_code}' --compressed -A "$UA" -H 'Accept: text/html' --max-time 20 "$URL" || echo '000')
            LIVE=$(printf '%s' "$BODY" | grep -o 'assets/index-[^"]*\.js' | head -1 || true)
            echo "Tentativo $i: HTTP $CODE — il sito serve '$LIVE'"
            if [ "$LIVE" = "$ATTESO" ]; then
              echo "OK: il sito serve il bundle atteso"
              break
            fi
            if [ -z "$LIVE" ]; then
              echo "  └ body (primi 300 caratteri): $(printf '%s' "$BODY" | head -c 300)"
            fi
            if [ "$i" = "20" ]; then
              echo "ERRORE: dopo 10 minuti il sito serve ancora un bundle diverso"; exit 1
            fi
            sleep 30
          done

          # Il chunk Dashboard corretto deve rispondere 200
          curl -sSf --max-time 20 -o /dev/null "https://impresasemplice.online/assets/$DASH"
          echo "OK: chunk Dashboard ($DASH) servito correttamente"

          # Backend vivo
          curl -sSf --max-time 20 https://impresasemplice.online/api/health | head -c 200
          echo ""
          echo "VERIFICA PRODUZIONE COMPLETATA"
