name: Point 11 mutui reconciliation

on:
  push:
    paths:
      - ".github/workflows/point11-mutui.yml"
      - ".github/scripts/point11_mutui_patch.py"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ai/prompt-governance-supabase
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r backend/requirements.txt
      - name: Apply mutui reconciliation patch
        run: python .github/scripts/point11_mutui_patch.py
      - name: Run mutui regression tests
        run: python -m pytest -q tests/test_point11_mutui_reconciliation.py
      - name: Commit mutui reconciliation patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/routers/mutui.py tests/test_point11_mutui_reconciliation.py
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "fix: require unique bank evidence for loan installments"
          git push origin HEAD:ai/prompt-governance-supabase
