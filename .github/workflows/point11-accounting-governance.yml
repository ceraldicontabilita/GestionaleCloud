name: Point 11 accounting governance

on:
  push:
    paths:
      - ".github/workflows/point11-accounting-governance.yml"
      - ".github/scripts/point11_accounting_governance_patch.py"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ai/prompt-governance-supabase
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r backend/requirements.txt
      - name: Apply point 11 patch
        run: python .github/scripts/point11_accounting_governance_patch.py
      - name: Run point 11 tests
        run: |
          python -m pytest -q \
            tests/test_point11_accounting_governance.py \
            tests/test_bilancio_immobilizzazioni_e_fondo_tfr.py \
            tests/test_bilancio_export_coerenza.py
      - name: Commit point 11 patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/routers/accounting/bilancio.py app/routers/accounting/centri_costo.py tests/test_point11_accounting_governance.py
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "fix: align accounting views and evidence semantics"
          git push origin HEAD:ai/prompt-governance-supabase
