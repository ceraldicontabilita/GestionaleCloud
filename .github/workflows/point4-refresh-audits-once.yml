name: Point4 refresh audits once

on:
  push:
    branches:
      - ai/prompt-governance-supabase
    paths:
      - .github/workflows/point4-refresh-audits-once.yml

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ai/prompt-governance-supabase
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Installa dipendenze backend
        run: python -m pip install -r backend/requirements.txt
      - name: Rigenera audit e mappe
        run: |
          python scripts/audit_frontend_dead_code.py
          python scripts/genera_mappa.py
          python scripts/genera_classificazione_endpoint.py
          python scripts/audit_frontend_backend_contract.py
      - name: Verifica contratti punti 3 e 4
        run: |
          python -m pytest -q \
            tests/test_point4_dashboard_navigation.py \
            tests/test_endpoint_classification_dynamic.py \
            tests/test_frontend_api_refs_dynamic.py \
            tests/test_frontend_api_contract.py \
            tests/test_point3_f24_contract.py
      - name: Commit artefatti generati
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            memoria/AUDIT_FRONTEND_DEAD_CODE.md \
            memoria/MAPPA_ROUTER.md \
            memoria/MAPPA_ENDPOINT_COMPLETA.md \
            memoria/ENDPOINT_CLASSIFICAZIONE_FINALE.md \
            memoria/AUDIT_FRONTEND_BACKEND_CONTRACT.md
          if git diff --cached --quiet; then
            echo "Audit gia' coerenti"
            exit 0
          fi
          git commit -m "docs: refresh dashboard navigation audits"
          git pull --rebase origin ai/prompt-governance-supabase
          git push origin HEAD:ai/prompt-governance-supabase
