name: Point 6 supplier payment boundary
on:
  push:
    branches: [ai/prompt-governance-supabase]
    paths: [.github/workflows/point6-invoice-payment-boundary.yml]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ai/prompt-governance-supabase
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Patch supplier payment-method boundary
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('frontend/src/pages/Fornitori.jsx')
          s = p.read_text()
          s = s.replace(
              "const getMetodo = key => METODI_PAGAMENTO[key] || METODI_PAGAMENTO.banca;",
              "const getMetodo = key => METODI_PAGAMENTO[key] || { label: 'Non definito', bg: COLORS.gray[100], color: COLORS.textMuted };"
          )
          s = s.replace("  metodo_pagamento: 'banca',", "  metodo_pagamento: '',")
          s = s.replace(
              "value={canaleCanonico(form.metodo_pagamento) || 'banca'}",
              "value={canaleCanonico(form.metodo_pagamento) || ''}"
          )
          marker = """                  >\n                    {Object.entries(METODI_PAGAMENTO).map(([key, val]) => (\n"""
          replacement = """                  >\n                    <option value=\"\">Non definito</option>\n                    {Object.entries(METODI_PAGAMENTO).map(([key, val]) => (\n"""
          if marker not in s:
              raise SystemExit('supplier method select marker not found')
          s = s.replace(marker, replacement, 1)
          p.write_text(s)

          p = Path('app/routers/suppliers_module/base.py')
          s = p.read_text()
          old = '''    if "metodo_pagamento" in data:\n        if data["metodo_pagamento"] not in PAYMENT_METHODS:\n            raise HTTPException(status_code=400, detail="Metodo pagamento non valido")\n        metodo_configurato = data["metodo_pagamento"] is not None and data["metodo_pagamento"] != ""\n'''
          new = '''    if "metodo_pagamento" in data:\n        metodo = str(data.get("metodo_pagamento") or "").strip().lower()\n        if metodo and metodo not in PAYMENT_METHODS:\n            raise HTTPException(status_code=400, detail="Metodo pagamento non valido")\n        # Vuoto significa esplicitamente \"non definito\": non inventare Banca.\n        data["metodo_pagamento"] = metodo\n        metodo_configurato = bool(metodo)\n'''
          if old not in s:
              raise SystemExit('supplier update validation block not found')
          p.write_text(s.replace(old, new))

          p = Path('tests/test_supplier_payment_method_boundary.py')
          p.write_text('''from pathlib import Path\n\n\ndef test_supplier_ui_does_not_default_to_bank():\n    src = Path("frontend/src/pages/Fornitori.jsx").read_text()\n    assert "metodo_pagamento: ''," in src\n    assert "value={canaleCanonico(form.metodo_pagamento) || ''}" in src\n    assert '<option value="">Non definito</option>' in src\n    assert "METODI_PAGAMENTO[key] || METODI_PAGAMENTO.banca" not in src\n\n\ndef test_supplier_update_accepts_explicit_undefined_method():\n    src = Path("app/routers/suppliers_module/base.py").read_text()\n    block = src.split('if "metodo_pagamento" in data:', 1)[1].split('if "termini_pagamento" in data:', 1)[0]\n    assert 'metodo = str(data.get("metodo_pagamento") or "")' in block\n    assert 'if metodo and metodo not in PAYMENT_METHODS' in block\n    assert 'data["metodo_pagamento"] = metodo' in block\n    assert 'metodo_configurato = bool(metodo)' in block\n''')
          PY
      - name: Run focused tests
        run: |
          pip install -r backend/requirements.txt >/dev/null
          python -m pytest -q tests/test_invoice_payment_evidence_boundary.py tests/test_supplier_payment_method_boundary.py
      - name: Commit point 6 supplier fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/src/pages/Fornitori.jsx app/routers/suppliers_module/base.py tests/test_supplier_payment_method_boundary.py
          git commit -m "fix: keep undefined supplier payment method explicit"
          git push origin HEAD:ai/prompt-governance-supabase
