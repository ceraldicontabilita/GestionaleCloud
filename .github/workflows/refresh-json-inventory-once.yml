name: Refresh JSON inventory once

on:
  push:
    branches:
      - ai/prompt-governance-supabase
    paths:
      - .github/workflows/refresh-json-inventory-once.yml

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ai/prompt-governance-supabase
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Rigenera solo JSON_INVENTORY
        run: |
          python - <<'PY'
          from scripts.refresh_json_docs import write_inventory, source_revision
          write_inventory(source_revision(), "2026-09-11")
          PY
      - name: Commit inventario aggiornato
        run: |
          if git diff --quiet -- memoria/JSON_INVENTORY.json; then
            echo "Inventario già aggiornato"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add memoria/JSON_INVENTORY.json
          git commit -m "docs: refresh JSON inventory"
          git push origin HEAD:ai/prompt-governance-supabase
