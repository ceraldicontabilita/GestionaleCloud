name: Point 11 budget consistency

on:
  push:
    paths:
      - ".github/workflows/point11-budget-consistency.yml"
      - ".github/scripts/point11_budget_consuntivo_patch.py"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ai/prompt-governance-supabase
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r backend/requirements.txt
      - name: Apply point 11 budget patch
        run: python .github/scripts/point11_budget_consuntivo_patch.py
      - name: Run budget consistency tests
        run: |
          python -m pytest -q \
            tests/test_point11_budget_consistency.py \
            tests/test_point11_accounting_governance.py \
            tests/test_bilancio_export_coerenza.py
      - name: Commit budget consistency patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/routers/accounting/contabilita_gestionale.py tests/test_point11_budget_consistency.py
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "fix: align budget actuals with canonical P&L"
          git push origin HEAD:ai/prompt-governance-supabase
