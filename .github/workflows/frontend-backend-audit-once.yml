name: Frontend backend audit once

on:
  push:
    branches:
      - ai/prompt-governance-supabase
    paths:
      - .github/workflows/frontend-backend-audit-once.yml
      - scripts/audit_frontend_backend_contract.py

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ai/prompt-governance-supabase
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Installa dipendenze backend
        run: pip install -r backend/requirements.txt
      - name: Genera audit
        id: audit
        shell: bash
        run: |
          set +e
          python scripts/audit_frontend_backend_contract.py
          status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
          test -f memoria/AUDIT_FRONTEND_BACKEND_CONTRACT.md
          exit 0
      - name: Commit report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add memoria/AUDIT_FRONTEND_BACKEND_CONTRACT.md
          if git diff --cached --quiet; then
            echo "Report invariato"
          else
            git commit -m "docs: generate frontend-backend contract audit"
            git push origin HEAD:ai/prompt-governance-supabase
          fi
      - name: Propaga esito audit
        if: steps.audit.outputs.status != '0'
        run: exit 1
