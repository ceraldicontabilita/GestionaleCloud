name: Point3 final inventory once

on:
  push:
    branches:
      - ai/prompt-governance-supabase
    paths:
      - .github/workflows/point3-f24-contract-fix-once.yml

permissions:
  contents: write

jobs:
  inventory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ai/prompt-governance-supabase
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Installa dipendenze backend
        run: python -m pip install -r backend/requirements.txt
      - name: Verifica contratti punto 3
        run: |
          python -m pytest -q \
            tests/test_endpoint_classification_dynamic.py \
            tests/test_frontend_api_refs_dynamic.py \
            tests/test_frontend_api_contract.py \
            tests/test_point3_f24_contract.py
      - name: Rigenera inventario endpoint
        run: python scripts/genera_classificazione_endpoint.py
      - name: Rigenera audit frontend backend
        run: python scripts/audit_frontend_backend_contract.py
      - name: Commit inventari punto 3
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add memoria/ENDPOINT_CLASSIFICAZIONE_FINALE.md memoria/AUDIT_FRONTEND_BACKEND_CONTRACT.md
          if git diff --cached --quiet; then
            echo "Inventari invariati"
            exit 0
          fi
          git commit -m "docs: finalize point 3 inventories"
          git pull --rebase origin ai/prompt-governance-supabase
          git push origin HEAD:ai/prompt-governance-supabase
