name: Point 5 refresh generated maps

on:
  push:
    branches:
      - ai/prompt-governance-supabase
    paths:
      - .github/workflows/point5-refresh-generated-maps.yml

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ai/prompt-governance-supabase
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install backend dependencies
        run: pip install -r backend/requirements.txt
      - name: Regenerate maps
        run: |
          python scripts/genera_mappa.py
          python scripts/genera_classificazione_endpoint.py
      - name: Commit generated maps
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add memoria/MAPPA_ROUTER.md memoria/MAPPA_ENDPOINT_COMPLETA.md memoria/ENDPOINT_CLASSIFICAZIONE_FINALE.md
          if git diff --cached --quiet; then
            echo "No generated changes"
            exit 0
          fi
          git commit -m "docs: refresh endpoint maps after point 5"
          git push origin HEAD:ai/prompt-governance-supabase
