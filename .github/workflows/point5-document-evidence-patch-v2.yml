name: Point 5 document evidence patch v2

on:
  push:
    branches:
      - ai/prompt-governance-supabase
    paths:
      - .github/workflows/point5-document-evidence-patch-v2.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ai/prompt-governance-supabase
          fetch-depth: 0

      - name: Validate patch script
        run: python -m py_compile .github/scripts/point5_patch.py

      - name: Apply point 5 patch
        run: python .github/scripts/point5_patch.py

      - name: Syntax check
        run: |
          python -m compileall -q \
            app/services/document_import_preview.py \
            app/services/fiscal_document_ingestion.py \
            app/routers/documenti.py \
            app/routers/document_ai.py \
            tests/test_document_ai_evidence_governance.py

      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            app/services/document_import_preview.py \
            app/services/fiscal_document_ingestion.py \
            app/routers/documenti.py \
            app/routers/document_ai.py \
            frontend/src/pages/ImportDocumenti.jsx \
            frontend/src/pages/Documenti.jsx \
            frontend/src/pages/ImportDocumenti.test.jsx \
            tests/test_document_import_preview.py \
            tests/test_documenti_archivio.py \
            tests/test_documenti_import_sicuro.py \
            tests/test_document_ai_evidence_governance.py
          git diff --cached --check
          git commit -m "refactor: enforce document evidence governance"
          git push origin HEAD:ai/prompt-governance-supabase
