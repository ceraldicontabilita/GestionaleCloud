# Audit automatico di LAYOUT a ogni push: overflow orizzontale (elementi
# fuori card/schermo) e titoli invisibili (navy su navy) su tutte le pagine,
# mobile e desktop. Nato dall'ennesima regressione dell'11/07: questa
# classe di errori ora si blocca da sola PRIMA di arrivare in produzione.
name: Audit layout

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "frontend/src/**"
      - "frontend/scripts/audit-layout.cjs"
      - ".github/workflows/audit-layout.yml"

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn
          cache-dependency-path: frontend/yarn.lock

      - name: Installa dipendenze
        run: yarn install --frozen-lockfile

      - name: Build
        run: yarn build

      - name: Installa Chromium per Playwright
        run: |
          yarn add --dev playwright-core@1
          npx playwright-core install --with-deps chromium || npx playwright install --with-deps chromium

      - name: Avvia preview e lancia l'audit
        run: |
          npx vite preview --port 4173 &
          sleep 4
          node scripts/audit-layout.cjs
