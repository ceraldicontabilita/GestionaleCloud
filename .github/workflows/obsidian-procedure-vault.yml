name: Obsidian Procedure Vault

on:
  workflow_dispatch:
  schedule:
    - cron: "15 3 * * *"
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "scripts/build_obsidian_procedure_vault.py"
      - ".github/workflows/obsidian-procedure-vault.yml"

permissions:
  contents: read

jobs:
  build-vault:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Build safe Procedure vault
        run: >-
          python scripts/build_obsidian_procedure_vault.py
          --output-dir "$RUNNER_TEMP/GestionaleCloud-Procedure"
          --zip "$RUNNER_TEMP/GestionaleCloud-Procedure.zip"
      - name: Verify ZIP
        run: python -m zipfile --test "$RUNNER_TEMP/GestionaleCloud-Procedure.zip"
      - name: Publish rebuildable vault artifact
        uses: actions/upload-artifact@v6
        with:
          name: GestionaleCloud-Procedure-${{ github.sha }}
          path: ${{ runner.temp }}/GestionaleCloud-Procedure.zip
          if-no-files-found: error
          retention-days: 14
