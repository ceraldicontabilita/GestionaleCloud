# I collaudi isolati girano anche sulle PR, prima della fusione.
# La verifica del servizio pubblico gira esclusivamente su main.
name: Produzione

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "app/**"
      - "backend/**"
      - "frontend/**"
      - "frontend_hr/**"
      - "frontend_lotti/**"
      - "frontend_menu/**"
      - "frontend_shared/**"
      - "tests/**"
      - "scripts/e2e_distruttivo_server.py"
      - "scripts/smoke_app.py"
      - "scripts/build_frontends.sh"
      - "page_catalog.json"
      - "render.yaml"
      - ".github/workflows/produzione.yml"
  push:
    branches: [main]
    paths:
      - "app/**"
      - "backend/**"
      - "frontend/**"
      - "frontend_hr/**"
      - "frontend_lotti/**"
      - "frontend_menu/**"
      - "frontend_shared/**"
      - "tests/**"
      - "scripts/e2e_distruttivo_server.py"
      - "scripts/smoke_app.py"
      - "scripts/build_frontends.sh"
      - "page_catalog.json"
      - "render.yaml"
      - ".github/workflows/produzione.yml"

permissions:
  contents: read

concurrency:
  group: produzione-${{ github.ref }}
  cancel-in-progress: true

env:
  PROD_URL: https://gestionalecloud.onrender.com

jobs:
  e2e:
    name: E2E distruttivo su ERP isolato
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn
          cache-dependency-path: frontend/yarn.lock
      - name: Installa backend
        run: pip install -r backend/requirements.txt
      - name: Installa frontend e Chromium
        working-directory: frontend
        run: |
          yarn install --frozen-lockfile
          npx playwright-core install --with-deps chromium
      - name: Build frontend ERP per il collaudo isolato
        working-directory: frontend
        run: yarn build:erp
      - name: Avvia ERP isolato
        run: |
          python -m uvicorn scripts.e2e_distruttivo_server:app \
            --host 127.0.0.1 --port 8788 --no-access-log \
            > /tmp/e2e-distruttivo-server.log 2>&1 &
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8788/api/health && break
            if [ "$i" = "30" ]; then
              sed -E 's/(token=)[^ &]+/\1[REDACTED]/g' /tmp/e2e-distruttivo-server.log
              exit 1
            fi
            sleep 1
          done
      - name: Operazioni distruttive
        run: |
          node frontend/scripts/audit-destructive-e2e.cjs || {
            echo "::group::Log ERP isolato"
            sed -E 's/(token=)[^ &]+/\1[REDACTED]/g; s/(Authorization: Bearer )[A-Za-z0-9._-]+/\1[REDACTED]/g' /tmp/e2e-distruttivo-server.log || true
            echo "::endgroup::"
            exit 1
          }
      - name: Tutte le schermate catalogate
        run: node frontend/scripts/audit-pages-e2e.cjs
      - name: Conserva prove visive della Prima Nota
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prima-nota-e2e-${{ github.run_attempt }}
          path: /tmp/prima-nota-e2e/
          if-no-files-found: warn
          retention-days: 7

  browser:
    name: Audit layout e viewer
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn
          cache-dependency-path: frontend/yarn.lock
      - name: Installa dipendenze
        run: yarn install --frozen-lockfile
      - name: Build frontend ERP per il collaudo visivo
        run: yarn build:erp
      - name: Installa Chromium per Playwright
        run: npx playwright-core install --with-deps chromium || npx playwright install --with-deps chromium
      - name: Avvia preview
        run: |
          npx vite preview --port 4173 &
          sleep 4
      - name: Audit layout
        run: node scripts/audit-layout.cjs
      - name: Audit viewer documenti
        run: node scripts/audit-viewer.cjs

  deploy:
    name: La produzione serve questo commit
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Ricostruisci il frontend del commit
        run: |
          set -euo pipefail
          npm --prefix frontend install --include=dev --legacy-peer-deps
          npm --prefix frontend run build
      - name: Attendi il bundle del commit e controlla la salute
        run: |
          set -euo pipefail
          ATTESO=$(grep -o 'assets/index-[^"]*\.js' frontend/dist/index.html | head -1)
          if [ -z "$ATTESO" ]; then
            echo "::error::bundle atteso non trovato dopo la build"
            exit 1
          fi
          echo "Commit $GITHUB_SHA, bundle atteso $ATTESO"
          UA="Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126 Safari/537.36"
          for i in $(seq 1 30); do
            BODY=$(curl -sS --compressed -A "$UA" -H 'Accept: text/html' --max-time 20 "$PROD_URL/login" || true)
            LIVE=$(printf '%s' "$BODY" | grep -o 'assets/index-[^"]*\.js' | head -1 || true)
            echo "Tentativo $i/30: live='$LIVE'"
            [ "$LIVE" = "$ATTESO" ] && break
            if [ "$i" = "30" ]; then
              echo "::error::la produzione non serve il bundle di $GITHUB_SHA (atteso $ATTESO, live $LIVE)"
              exit 1
            fi
            sleep 30
          done
          curl -sSf --max-time 20 -o /dev/null "$PROD_URL/$ATTESO"
          curl -sSf --max-time 20 "$PROD_URL/api/health" | head -c 500
      - name: Smoke runtime
        env:
          BACKEND_URL: ${{ env.PROD_URL }}
          FRONTEND_URL: ${{ env.PROD_URL }}
          SMOKE_TIMEOUT: "20"
          SMOKE_EXPECTED_COMMIT: ${{ github.sha }}
          SMOKE_DEPLOY_WAIT_SECONDS: "900"
          SMOKE_DEPLOY_POLL_SECONDS: "15"
        run: python scripts/smoke_app.py
