name: Point 11 mutui and closing

on:
  push:
    paths:
      - ".github/workflows/point11-mutui-chiusura.yml"
      - ".github/scripts/point11_mutui_chiusura_patch.py"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ai/prompt-governance-supabase
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r backend/requirements.txt
      - name: Apply point 11 mutui closing patch
        run: python .github/scripts/point11_mutui_chiusura_patch.py
      - name: Run targeted tests
        run: |
          python -m pytest -q \
            tests/test_point11_mutui_chiusura.py \
            tests/test_audit_pagine_contabilita.py \
            tests/test_point11_assets_cdc.py
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/routers/mutui.py app/routers/chiusura_esercizio.py tests/test_point11_mutui_chiusura.py
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "fix: harden mortgage matching and carry SumUp closing balance"
          git push origin HEAD:ai/prompt-governance-supabase
