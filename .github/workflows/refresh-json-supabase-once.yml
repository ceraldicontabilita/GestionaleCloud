name: Refresh generated docs once

on:
  push:
    branches:
      - ai/prompt-governance-supabase
    paths:
      - .github/workflows/refresh-json-supabase-once.yml

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ai/prompt-governance-supabase
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Installa test runner
        run: python -m pip install pytest
      - name: Allinea generatori all'architettura corrente
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('scripts/refresh_json_docs.py')
          text = path.read_text(encoding='utf-8')
          replacements = {
              '"stato_corrente": "google_drive_sheets"': '"stato_corrente": "supabase_runtime_drive_originals"',
              '"backend_predefinito": "sheets"': '"backend_predefinito": "supabase"',
              '"compatibilita": "nessun_backend_alternativo"': '"compatibilita": "sheets_transitorio_rollback"',
              '"current": "google_drive_sheets"': '"current": "supabase_runtime_drive_originals"',
              '"registry": "sheets"': '"registry": "supabase"',
              '"compatibility": "nessun_backend_alternativo"': '"compatibility": "sheets_transitorio_rollback"',
              'meta["versione"] = "5.0-drive-sheets-operational"': 'meta["versione"] = "6.0-supabase-drive-operational"',
              '"Drive/Sheets è l\'unico archivio operativo; non esiste fallback alternativo."': '"Supabase è il registro strutturato; Google Drive conserva gli originali; Sheets resta solo rollback transitorio."',
              '"Il backend interroga i registri Sheets e legge gli originali autorizzati da Drive."': '"Il backend interroga il registro Supabase e legge gli originali autorizzati da Drive."',
              '"Il modello non può costruire query libere contro Sheets o Drive."': '"Il modello non può costruire query libere contro Supabase o Drive."',
          }
          for old, new in replacements.items():
              text = text.replace(old, new)
          text = text.replace(
              '        "backend_predefinito": "supabase",\n        "compatibilita":',
              '        "backend_predefinito": "supabase",\n        "originali": "drive",\n        "compatibilita":',
          )
          path.write_text(text, encoding='utf-8')

          kit = Path('scripts/genera_kit_ricostruzione.py')
          kit_text = kit.read_text(encoding='utf-8')
          kit_text = kit_text.replace('"storage_target": "google_drive_sheets"', '"storage_target": "supabase_runtime_drive_originals"')
          kit.write_text(kit_text, encoding='utf-8')
          PY
      - name: Rigenera documentazione JSON
        run: python scripts/refresh_json_docs.py --updated-at 2026-09-11
      - name: Rigenera inventario Markdown
        run: python scripts/refresh_markdown_docs.py
      - name: Verifica documentazione generata
        run: python -m pytest -q tests/test_json_documentation.py tests/test_markdown_documentation.py
      - name: Commit aggiornamento
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/refresh_json_docs.py scripts/genera_kit_ricostruzione.py page_catalog.json app/knowledge/chat_kb.json memoria/JSON_INVENTORY.json memoria/pagine memoria/popup docs/MARKDOWN_INVENTORY.md -- '*.md'
          if git diff --cached --quiet; then
            echo "Nessuna modifica da salvare"
            exit 0
          fi
          git commit -m "docs: regenerate inventories for Supabase runtime"
          git pull --rebase origin ai/prompt-governance-supabase
          git push origin HEAD:ai/prompt-governance-supabase
